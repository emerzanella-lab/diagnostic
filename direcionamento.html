<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Direcionamento de Carreira</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Montserrat:wght@500;600;700&display=swap">
<style>
/* Layout: uma pergunta por tela, como uma prancha técnica — moldura com marcas de cota, progresso em régua graduada */
:root{
  --navy:#081623; --navy-2:#0e2133; --line:#1f3549;
  --gold:#be8037; --gold-hi:#d9a463; --cream:#fbfafb; --muted:#9fb0c0; --err:#e57a6a;
  --f-title:"Georgia Pro",Georgia,"Times New Roman",serif;
  --f-sub:"Montserrat","Segoe UI",Arial,sans-serif;
  --f-body:"DM Sans","Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--navy);color:var(--cream);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:linear-gradient(var(--navy-2) 1px,transparent 1px),linear-gradient(90deg,var(--navy-2) 1px,transparent 1px);
  background-size:32px 32px;background-position:center top}
.wrap{max-width:640px;margin:0 auto;padding-block:28px 40px;min-height:100%;display:flex;flex-direction:column;gap:22px}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:32px}
.brand{font-family:var(--f-sub);font-weight:600;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.count{font-family:var(--f-sub);font-size:12px;letter-spacing:.08em;color:var(--muted);font-variant-numeric:tabular-nums}
.ruler{position:relative;height:14px}
.ruler .ticks{position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px calc(100%/12));border-bottom:1px solid var(--line)}
.ruler .fill{position:absolute;left:0;bottom:-1px;height:3px;width:0;background:linear-gradient(90deg,var(--gold),var(--gold-hi));transition:width .45s ease}

/* prancha */
.sheet{position:relative;background:rgba(8,22,35,.92);border:1px solid var(--line);padding:32px 24px 28px;flex:1;display:flex;flex-direction:column}
.sheet::before,.sheet::after{content:"";position:absolute;width:18px;height:18px;border-color:var(--gold);border-style:solid}
.sheet::before{top:-1px;left:-1px;border-width:2px 0 0 2px}
.sheet::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.step{display:flex;flex-direction:column;gap:18px;animation:in .4s ease both}
@keyframes in{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.step{animation:none}.ruler .fill{transition:none}}

/* intro */
.logo{width:64px;height:auto;max-width:100%;align-self:center;display:block;opacity:.95}
h1{font-family:var(--f-title);font-weight:400;font-size:clamp(28px,6vw,38px);line-height:1.15;margin:0;text-align:center;text-wrap:balance}
h1 em{font-style:italic;color:var(--gold-hi)}
.lead{color:#d6dee6;margin:0;text-align:center;max-width:52ch;align-self:center}
.facts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;font-family:var(--f-sub);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.facts span::before{content:"";display:inline-block;width:6px;height:6px;background:var(--gold);margin-right:8px;transform:rotate(45deg) translateY(-2px)}
.note{border-left:2px solid var(--gold);padding:10px 14px;background:rgba(190,128,55,.08);font-size:14px;color:#d6dee6}
.note b{color:var(--cream);font-weight:600}

/* pergunta */
.qnum{font-family:var(--f-sub);font-weight:600;font-size:12px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.q{font-family:var(--f-title);font-weight:400;font-size:clamp(23px,5vw,30px);line-height:1.22;margin:0;text-wrap:balance}
.hint{color:var(--muted);font-size:14px;margin:-6px 0 0}
input[type=text],input[type=tel],textarea{width:100%;background:transparent;border:0;border-bottom:1.5px solid var(--line);
  color:var(--cream);font:500 19px/1.4 var(--f-body);padding:10px 2px;outline:none;transition:border-color .2s;border-radius:0}
textarea{min-height:120px;resize:vertical;border:1.5px solid var(--line);padding:12px 14px;font-size:17px}
input::placeholder,textarea::placeholder{color:#5b7084}
input:focus,textarea:focus{border-color:var(--gold)}
.opts{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;border:0}
.opt{position:relative;display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);background:rgba(14,33,51,.6);
  cursor:pointer;transition:border-color .15s,background .15s;font-size:16px}
.opt:hover{border-color:#3a5670}
.opt input{position:absolute;opacity:0;pointer-events:none}
.key{flex:none;width:26px;height:26px;display:grid;place-items:center;border:1px solid #3a5670;font:600 12px var(--f-sub);color:var(--muted)}
.opt:has(input:checked){border-color:var(--gold);background:rgba(190,128,55,.12)}
.opt:has(input:checked) .key{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.opt:has(input:focus-visible){outline:2px solid var(--gold-hi);outline-offset:2px}
.other{margin-top:4px}
.err{color:var(--err);font-size:14px;min-height:1.3em;margin:0}

/* ações */
.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:26px}
.btn{font:700 14px var(--f-sub);letter-spacing:.1em;text-transform:uppercase;border:0;cursor:pointer;padding:15px 24px;
  background:linear-gradient(135deg,var(--gold),var(--gold-hi));color:var(--navy);display:inline-flex;align-items:center;gap:10px;transition:filter .15s,transform .15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.6;cursor:wait}
.btn:focus-visible,.ghost:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
.ghost{background:none;border:0;color:var(--muted);font:600 13px var(--f-sub);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;padding:12px 4px}
.ghost:hover{color:var(--cream)}
.enter{font-size:12px;color:#5b7084;display:none}
@media (min-width:700px){.enter{display:inline}.sheet{padding:44px 44px 36px}}
.btn.wide{width:100%;justify-content:center}

/* final */
.done{text-align:center;align-items:center}
.seal{width:72px;height:72px;border:2px solid var(--gold);display:grid;place-items:center;transform:rotate(45deg)}
.seal svg{transform:rotate(-45deg)}
.foot{text-align:center;font-family:var(--f-sub);font-size:12px;letter-spacing:.12em;color:var(--muted)}
.foot a{color:var(--gold);text-decoration:none}
</style>
</head>

  <div class="top">
    <span class="brand">Método Zanella</span>
    <span class="count" id="count"></span>

const form = document.getElementById("form");
const fill = document.getElementById("fill");
const ruler = document.getElementById("ruler");
const count = document.getElementById("count");
const answers = {};
let step = -1; // -1 = abertura, QUESTIONS.length = enviado
const N = QUESTIONS.length;
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  ruler.hidden = step < 0 || step >= N;
  count.textContent = step >= 0 && step < N ? String(step+1).padStart(2,"0")+" / "+N : "";
  fill.style.width = step < 0 ? "0" : Math.min(100,(step/N)*100)+"%";
  if(step < 0) return renderIntro();
  if(step >= N) return renderDone();
  const Q = QUESTIONS[step], v = answers[Q.id] || {};
  let field = "";
  if(Q.type==="text"||Q.type==="tel"){
    field = `<input id="f_${Q.id}" type="${Q.type}" inputmode="${Q.type==="tel"?"tel":"text"}" autocomplete="${Q.auto}" placeholder="${esc(Q.ph)}" value="${esc(v.value||"")}">`;
  } else if(Q.type==="textarea"){
    field = `<textarea id="f_${Q.id}" placeholder="${esc(Q.ph)}">${esc(v.value||"")}</textarea>`;
  } else {
    const all = Q.other ? [...Q.opts,"Outro"] : Q.opts;
    field = `<fieldset class="opts" aria-labelledby="ql">` + all.map((o,i)=>`
      <label class="opt"><input type="radio" name="r_${Q.id}" value="${esc(o)}" ${v.value===o?"checked":""}>
      <span class="key">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></label>`).join("") + `</fieldset>`;
  }
  const last = step===N-1;
  form.innerHTML = `<div class="step">
    <span class="qnum">Pergunta ${step+1}</span>
    <h2 class="q" id="ql">${esc(Q.q)}</h2>
    ${Q.hint?`<p class="hint">${esc(Q.hint)}</p>`:""}
    ${field}
    <p class="err" id="err" role="alert"></p>
  </div>
  <div class="actions">
    <button type="button" class="ghost" id="back">← Voltar</button>
    <span style="display:flex;align-items:center;gap:12px">
      <span class="enter">${Q.type==="textarea"?"Ctrl + Enter":"Enter ↵"}</span>
      <button type="submit" class="btn" id="next">${last?"Enviar aplicação":"Continuar"} <span aria-hidden="true">→</span></button>
    </span>
  </div>`;
  document.getElementById("back").onclick = ()=>{ save(); step--; render(); };
  if(Q.type==="radio"){
    form.querySelectorAll(`input[name="r_${Q.id}"]`).forEach(r=>r.addEventListener("change",()=>{
      const o = document.getElementById(`f_${Q.id}_other`);
      if(o){ o.hidden = r.value!=="Outro"; if(!o.hidden){ o.focus(); return; } }
      setTimeout(()=>next(), 260);
    }));
  }
  const first = form.querySelector("input:not([type=radio]):not([hidden]),textarea") || form.querySelector("input[type=radio]:checked") ;
  if(first && window.matchMedia("(min-width:700px)").matches) first.focus({preventScroll:true});
  const ta = form.querySelector("textarea");
  if(ta) ta.addEventListener("keydown",e=>{ if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();next();} });
}

function renderIntro(){
  form.innerHTML = `<div class="step">
    <img class="logo" src="${LOGO}" alt="Método Zanella" width="64" height="64">
    <h1>Direcionamento <em>gratuito</em> de carreira</h1>
    <p class="lead">Uma sessão gratuita e exclusiva para engenheiros, técnicos e estudantes de engenharia que querem acelerar a carreira em obras e projetos, conquistar melhores salários e assumir posições de gestão valorizadas no mercado.</p>
    <div class="facts"><span>Menos de 2 minutos</span><span>12 perguntas</span><span>Contato por WhatsApp</span></div>
    <div class="note"><b>Aplique apenas se for o seu caso.</b> O envio não garante a vaga: cada aplicação é avaliada individualmente. Com base nas suas respostas, eu mesmo entro em contato por WhatsApp para confirmar o agendamento.</div>
  </div>
  <div class="actions"><button type="submit" class="btn wide" id="next">Quero aplicar <span aria-hidden="true">→</span></button></div>`;
}

function renderDone(){
  const nome = (answers.nome?.value||"").split(" ")[0];
  form.innerHTML = `<div class="step done">
    <div class="seal"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#d9a463" stroke-width="2.2"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1>Aplicação recebida${nome?`, <em>${esc(nome)}</em>`:""}.</h1>
    <p class="lead">Vou analisar as suas respostas pessoalmente. Se o seu perfil tiver aderência, eu te chamo no WhatsApp para confirmar o dia e o horário da sessão.</p>
    <p class="lead">Enquanto isso, acompanhe os conteúdos no Instagram.</p>
    <a class="btn" href="https://instagram.com/engzanella" target="_blank" rel="noopener">Ver @engzanella <span aria-hidden="true">→</span></a>
  </div>`;
  try{ localStorage.removeItem("mz_form"); }catch(e){}
}

function save(){
  if(step<0||step>=N) return;
  const Q = QUESTIONS[step];
  if(Q.type==="radio"){
    const c = form.querySelector(`input[name="r_${Q.id}"]:checked`);
    const o = document.getElementById(`f_${Q.id}_other`);
    answers[Q.id] = {value:c?c.value:"", other:o?o.value.trim():""};
  } else {
    answers[Q.id] = {value:(document.getElementById("f_"+Q.id).value||"").trim()};
  }
  try{ localStorage.setItem("mz_form", JSON.stringify(answers)); }catch(e){}
}

function validate(){
  const Q = QUESTIONS[step], a = answers[Q.id], err = document.getElementById("err");
  let msg = "";
  if(!a.value) msg = Q.type==="radio" ? "Escolha uma das opções para continuar." : "Preencha este campo para continuar.";
  else if(Q.id==="nome" && a.value.split(/\s+/).length<2) msg = "Escreva nome e sobrenome.";
  else if(Q.id==="whats" && a.value.replace(/\D/g,"").length<10) msg = "Informe o número com DDD, ex.: (38) 99999-9999.";
  err.textContent = msg;
  return !msg;
}

function next(){
  if(step<0){ step=0; return render(); }
  save();
  if(!validate()) return;
  if(step===N-1) return submit();
  step++; render();
}

function submit(){
  const btn = document.getElementById("next");
  btn.disabled = true; btn.firstChild.textContent = "Enviando… ";
  const f = document.createElement("form");
  f.method="POST"; f.action=GOOGLE_FORM_ACTION; f.target="gf_sink"; f.hidden=true;
  const add=(n,v)=>{const i=document.createElement("input");i.type="hidden";i.name=n;i.value=v;f.appendChild(i);};
  QUESTIONS.forEach(Q=>{
    if(!Q.entry) return;
    const a = answers[Q.id];
    add(Q.entry,a.value);
  });
  document.body.appendChild(f);
  try{ f.submit(); }catch(e){}
  setTimeout(()=>{ step=N; render(); }, 900);
}

form.addEventListener("submit", e=>{ e.preventDefault(); next(); });
document.addEventListener("keydown", e=>{
  if(step<0||step>=N) return;
  const Q = QUESTIONS[step];
  if(Q.type!=="radio" || e.ctrlKey || e.metaKey || e.altKey) return;
  if(document.activeElement && document.activeElement.classList.contains("other")) return;
  const i = e.key.toUpperCase().charCodeAt(0)-65;
  const rs = form.querySelectorAll(`input[name="r_${Q.id}"]`);
  if(e.key.length===1 && i>=0 && i<rs.length){ rs[i].checked=true; rs[i].dispatchEvent(new Event("change")); }
});
try{ Object.assign(answers, JSON.parse(localStorage.getItem("mz_form")||"{}")); }catch(e){}
render();
</script>
